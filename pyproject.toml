[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-preserving-data-sharing-demo"
version = "0.1.0"
description = "Educational, synthetic policy-driven data-sharing reference implementation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohit Nomula" }]
dependencies = []

[project.scripts]
privacy-share = "privacy_share.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
